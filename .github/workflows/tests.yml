name: E3 - Pruebas de disponibilidad

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-disponibilidad:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Ejecutar pruebas unitarias
        run: python -m unittest discover -s tests -v
